name: CI and publish

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  # Re-run publishing without pushing a new tag.
  workflow_dispatch:

permissions:
  contents: read

# Publishing uses npm Trusted Publishing (OIDC): no npm token is stored in
# this repository. The trusted publisher is configured on
# https://www.npmjs.com/package/pi-at-skills/access

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ["22.19", "24"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
      # No install step: the tests run on node's own type stripping and never
      # import pi at runtime.
      - run: npm test

  publish:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required for npm provenance / trusted publishing.
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      - run: npm test
      - name: Check that the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$VERSION" ]; then
            echo "tag $TAG does not match package.json version $VERSION" >&2
            exit 1
          fi
      - run: npm publish --provenance --access public